<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KaBuyo | Project Files & Resources</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body>

  <!-- Ambient Animated Orbs & Spotlight -->
  <div class="orb-layer">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
  </div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- Main Container -->
  <div class="wrap">
    <header>
      <div class="title-wrap">
        <h1>
          <span class="badge" title="KaBuyo Final Project Hub"><i data-i="all"></i></span>
          KaBuyo <b>files</b>
        </h1>
        <p class="sub">SIA & WST final project links, documents, guidelines, and PDFs.</p>
      </div>
      <div class="header-actions">
        <button class="theme" id="syncBtn" aria-label="Sync with GitHub" title="Sync / Connect GitHub Token">
          <i data-i="github"></i>
        </button>
        <button class="theme" id="theme" aria-label="Toggle light / dark mode" title="Toggle theme">
          <i data-i="theme"></i>
        </button>
      </div>
    </header>

    <!-- Filter & Search Bar -->
    <div class="glass bar bar-wrap">
      <div class="group" id="subjects"></div>
      <div class="group" id="types"></div>
      <div class="search-box">
        <i data-i="search"></i>
        <input type="text" id="search" placeholder="Search files & PDFs..." autocomplete="off">
      </div>
    </div>

    <!-- Files List -->
    <div class="list" id="list"></div>

    <!-- Add Resource Form -->
    <form class="glass add" id="add">
      <div class="field">
        <i data-i="doc"></i>
        <input id="n" placeholder="File / Document name" required autocomplete="off">
      </div>
      <div class="field">
        <i data-i="link"></i>
        <input id="u" placeholder="Paste link (Google Docs, Drive, PDF URL, GitHub...)" required autocomplete="off">
      </div>
      <div class="field">
        <i data-i="SIA"></i>
        <select id="s">
          <option value="SIA">SIA</option>
          <option value="WST">WST</option>
          <option value="General">General</option>
        </select>
      </div>
      <div class="field">
        <i data-i="sheet"></i>
        <select id="t">
          <option value="pdf">PDF</option>
          <option value="doc">Doc</option>
          <option value="sheet">Sheet</option>
          <option value="slide">Slide</option>
          <option value="link">Link</option>
        </select>
      </div>
      <button class="go" type="submit"><i data-i="plus"></i>Add file</button>
    </form>

    <!-- Footer -->
    <footer>
      <span>KaBuyo Final Project &bull; BatStateU CICS &bull; GitHub Pages</span>
      <a href="#" id="resetDefault">Restore Project Links</a>
      <a href="#" id="exportData">Export Backup</a>
    </footer>
  </div>

  <!-- PDF Previewer Modal -->
  <div class="modal-backdrop" id="pdfModal" role="dialog" aria-modal="true" aria-labelledby="modalFilename">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title-area">
          <div class="ico pdf" id="modalIco"><i data-i="pdf"></i></div>
          <div style="min-width:0">
            <div class="modal-filename" id="modalFilename">PDF Document</div>
            <div class="modal-meta">
              <span id="modalSubject">SIA</span> &bull; <span>Built-in PDF Viewer</span>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <a class="modal-btn" id="modalDownload" href="#" download target="_blank" rel="noopener">
            <i data-i="download"></i> Download
          </a>
          <a class="modal-btn" id="modalExternal" href="#" target="_blank" rel="noopener">
            <i data-i="out"></i> Open Tab
          </a>
          <button class="modal-close" id="modalClose" aria-label="Close modal">
            <i data-i="close"></i>
          </button>
        </div>
      </div>
      <div class="modal-body">
        <iframe class="modal-frame" id="pdfFrame" title="PDF Viewer" allow="autoplay"></iframe>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"><i data-i="check"></i> <span id="toastMsg">Link copied!</span></div>

  <!-- Modular Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/github.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
